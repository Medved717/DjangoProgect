{% extends 'library/base.html' %}
{% block title %}Форма для автора{% endblock %}
{% include 'library/headers.html' %}
{% block content %}

<h1 class="mb-4">Форма для автора</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'library:author_list' %}" class="btn btn-primary">Отменить</a>
</form>
{% endblock %}
