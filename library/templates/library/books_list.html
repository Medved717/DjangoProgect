{% extends 'library/base.html' %}
{% block title %}Список книг{% endblock %}
{% block content %}
{% include 'library/header.html' %}
<h1 class="mb-4">Список книг</h1>
<ul class="list-group">
    {%for book in books%}
    <li class="list-group-item">
        <a href="{% url 'library:books_detail' book.pk %}">{{ book.title }}</a> - {{ book.publication_date | date:"d M Y" }} - {{ book.author }}

    </li>
    {% endfor %}
</ul>
{% endblock %}
